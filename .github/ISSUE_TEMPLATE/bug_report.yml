name: Bug 报告
description: 报告可以稳定复现的问题
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        感谢你报告问题。提交前请搜索现有 Issues，并删除日志或截图中的敏感信息。安全漏洞请按照 SECURITY.md 私下报告。
  - type: input
    id: version
    attributes:
      label: PortLens 版本
      placeholder: 例如 0.1.0 或 commit SHA
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows 版本
      placeholder: 例如 Windows 11 23H2 (22631.XXXX)
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 简要说明发生了什么。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开...
        2. 选择...
        3. 看到...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志或截图
      description: 可选。请先移除用户名、本地路径、命令行参数、令牌等敏感信息。
  - type: checkboxes
    id: checks
    attributes:
      label: 提交确认
      options:
        - label: 我已搜索现有 Issues，未发现相同问题。
          required: true
        - label: 这不是需要私下报告的安全漏洞。
          required: true
