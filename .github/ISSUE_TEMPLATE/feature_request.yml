name: 功能建议
description: 建议新的功能或体验改进
title: "[Feature]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: 感谢你的建议。请先说明实际问题，再描述希望采用的方案。
  - type: textarea
    id: problem
    attributes:
      label: 使用场景与痛点
      description: 当前工作流遇到了什么问题？它发生的频率和影响是什么？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 你希望 PortLens 如何解决这个问题？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已尝试的替代方案
      description: 可选。说明目前如何绕过问题，以及现有方案为什么不足。
  - type: textarea
    id: context
    attributes:
      label: 补充信息
      description: 可选。可提供界面草图、类似工具或技术资料。
  - type: checkboxes
    id: checks
    attributes:
      label: 提交确认
      options:
        - label: 我已搜索现有 Issues，未发现相同建议。
          required: true
