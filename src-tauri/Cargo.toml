[package]
name = "portlens"
version = "0.1.0"
description = "Inspect local listening ports and stop development processes"
license = "MIT"
authors = ["PortLens contributors"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "portlens_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
netstat2 = "0.11.2"
serde = { version = "1", features = ["derive"] }
sysinfo = { version = "0.39.6", default-features = false, features = ["system", "user"] }
tauri = { version = "2.10.2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
